<title><!--TITLE--></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>/*KATEX*/</style>
<style>
/* 白地の発表スライド。1920×1080 の舞台を画面に合わせて縮小する。単一テーマ。
   色の役割：--must は「全経路・確定」、--may は「一部の経路・注目」、--mute は「なし・補足」。題材に合わせて読み替える。 */
:root { --bg:#ffffff; --ink:#1a1a1a; --mute:#4b5563; --must:#1d5fd1; --may:#c2410c; --rule:#c9ced6; --mustbg:#eaf1fc; --maybg:#fdeee3; --nobg:#f0f1f3; --focus:#fff4cc;
  --sans:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif; --mono:'JetBrains Mono','Noto Sans Mono CJK JP',monospace; }
[hidden] { display:none !important; }
html,body { height:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--sans); display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px)); }
#view { flex:1; min-height:0; position:relative; overflow:hidden; }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); }
/* 日本語の改行。keep-all と deck.py が入れる <wbr> で文節ごとに折り返す。auto-phrase は対応ブラウザでの補強 */
#stage { word-break:keep-all; word-break:auto-phrase; line-break:strict; overflow-wrap:anywhere; text-wrap:pretty; }
.s h2, .s h1, .hd, .why, figcaption { text-wrap:balance; }
.katex, .n, pre { word-break:normal; overflow-wrap:normal; }
.s { position:absolute; inset:0; padding:44px 60px; font-size:44px; line-height:1.5; }
.s h2 { margin:0; font-size:60px; line-height:1.2; font-weight:700; }
.crumb { position:absolute; right:60px; top:56px; font-size:38px; color:var(--mute); }
.crumb b { color:var(--must); }
.cover { display:flex; flex-direction:column; justify-content:center; gap:28px; padding:128px; }
.cover h1 { margin:0 0 24px; font-size:104px; line-height:1.2; font-weight:700; }
.cover p { margin:0; font-size:44px; }
.txt { display:flex; flex-direction:column; gap:44px; font-size:48px; }
.txt table { font-size:46px; }
.txt table.sm { font-size:44px; }
.edges { position:absolute; left:0; top:0; width:1920px; height:1080px; }
.n { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--mono); font-size:36px; line-height:1.25;
  background:var(--bg); border:3px solid var(--ink); border-radius:10px; }
.n.focus { background:var(--focus); border-width:5px; }
.n.cmp { background:var(--maybg); border:5px solid var(--may); }
.n.must { background:var(--mustbg); border:5px solid var(--must); }
.n.k { background:#f4f5f7; font-weight:700; }
.n.split { border:3px dashed var(--must); }
.n.no { background:var(--nobg); border:5px solid var(--mute); }
.t { position:absolute; font-size:36px; line-height:1.3; }
.l { position:absolute; font-size:36px; font-weight:500; }
.f, .p, .ab { position:absolute; }
.p { display:flex; flex-direction:column; gap:22px; }
.why { margin:0; font-size:42px; color:var(--must); font-weight:500; }
.hd { margin:0; font-size:44px; font-weight:700; }
.p p { margin:0; }
ul { margin:0; padding-left:1.1em; }
li { margin:6px 0; }
pre { margin:0; font-family:var(--mono); font-size:40px; line-height:1.5; background:#f4f5f7; padding:26px 34px; border-radius:12px; }
table { border-collapse:collapse; width:100%; font-size:42px; }
th,td { text-align:left; padding:16px 22px; border-bottom:2px solid var(--rule); vertical-align:middle; }
th { color:var(--mute); font-weight:500; font-size:42px; }
tr.hl { background:var(--mustbg); }
table.sm { font-size:42px; }
.m { font-size:46px; overflow:hidden; }
.mi { font-size:44px; }
.big .m { font-size:56px; }
.katex { font-size:1em; }
.src { font-size:32px; color:var(--mute); }
.figs { position:absolute; left:60px; top:150px; bottom:40px; display:flex; gap:40px; }
.figs figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; height:100%; }
.figs img { height:calc(100% - 70px); width:auto; }
.figs figcaption { font-size:40px; }
nav { flex:none; display:flex; align-items:center; gap:12px; padding-block:8px; padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px)); border-top:1px solid var(--rule); font-size:14px; }
nav button { font:inherit; padding:6px 14px; background:var(--bg); color:var(--ink); border:1px solid var(--rule); border-radius:6px; cursor:pointer; }
nav button:focus-visible { outline:2px solid var(--must); outline-offset:1px; }
#no { font-variant-numeric:tabular-nums; min-width:8em; text-align:center; }
#notes { flex:none; max-height:30%; overflow:auto; padding-block:10px; padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px)); border-top:1px solid var(--rule); font-size:16px; line-height:1.7; }
</style>
<main id="view" tabindex="0" aria-label="スライド"><div id="stage" lang="ja">
<!--SLIDES-->
</div></main>
<div id="notes" hidden></div>
<nav aria-label="スライドの操作">
<button id="prev" type="button">前へ</button><span id="no"></span><button id="next" type="button">次へ</button>
<span style="flex:1"></span>
<button id="thidden" type="button" aria-pressed="false">hidden: 非表示</button><button id="tnotes" type="button">ノート</button><button id="tfull" type="button">全画面</button>
</nav>
<script>
const slides=[...document.querySelectorAll('#stage > section')], view=document.getElementById('view'), stage=document.getElementById('stage'), notes=document.getElementById('notes');
let cur=0,showOpt=false;
const off=i=>!showOpt&&slides[i].dataset.opt==='1';
// 非表示のスライドを除いて番号を振り直す。同じ data-page のコマは 1 ページに数える。
function counter(){const v=slides.filter((s,i)=>!off(i));let p=0,prev=null,no=0;
 for(const s of v){if(s.dataset.page!==prev){p++;prev=s.dataset.page;}if(s===slides[cur])no=p;}
 const g=v.filter(s=>s.dataset.page===slides[cur].dataset.page),k=g.indexOf(slides[cur])+1;
 return `${no} / ${p}`+(g.length>1?`（${k}/${g.length}）`:'');}
function step(d){let i=cur+d;while(i>=0&&i<slides.length&&off(i))i+=d;if(i>=0&&i<slides.length)show(i,1);}
function fit(){const r=view.getBoundingClientRect(),k=Math.min(r.width/1920,r.height/1080);stage.style.transform=`scale(${k}) translate(-50%,-50%)`;}
function show(i,push){cur=Math.max(0,Math.min(slides.length-1,i));while(off(cur))cur++;slides.forEach((s,j)=>s.hidden=j!==cur);
 document.getElementById('no').textContent=counter();notes.textContent=slides[cur].dataset.note||'';if(push)try{location.hash='s'+(cur+1)}catch(e){}}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('thidden').onclick=e=>{showOpt=!showOpt;e.currentTarget.textContent='hidden: '+(showOpt?'表示':'非表示');e.currentTarget.setAttribute('aria-pressed',showOpt);show(cur,1);};
document.getElementById('tnotes').onclick=()=>{notes.hidden=!notes.hidden;fit();};
document.getElementById('tfull').onclick=()=>{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});};
view.addEventListener('click',e=>{view.focus();const r=view.getBoundingClientRect();step((e.clientX-r.left)<r.width*0.25?-1:1);});
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();step(1);}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();step(-1);}else if(e.key==='Home')show(0,1);else if(e.key==='End')show(slides.length-1,1);else if(e.key==='n')document.getElementById('tnotes').click();else if(e.key==='f')document.getElementById('tfull').click();});
addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);
const h=/^#s(\d+)$/.exec(location.hash);show(h?+h[1]-1:0);fit();view.focus();
document.fonts&&document.fonts.ready.then(fit);
</script>
